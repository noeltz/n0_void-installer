name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck install.sh
        run: shellcheck install.sh

      # Script heredocs are invisible to ShellCheck; check every generated helper.
      - name: ShellCheck embedded helpers
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          text = pathlib.Path('install.sh').read_text()
          for tag in ('WRAPPER_EOF', 'CHEZMOI_EOF', 'CHEZMOI_GUI_EOF'):
              body = text.split("<<'" + tag + "'\n", 1)[1].split('\n' + tag, 1)[0]
              path = pathlib.Path('/tmp/void-installer-' + tag + '.sh')
              path.write_text(body + '\n')
              subprocess.run(['shellcheck', str(path)], check=True)
          PY

      - name: Desktop, state, resume and elogind regression checks
        run: |
          python3 tests/desktop-regression.py
          python3 tests/greetd-regression.py
          python3 tests/chezmoi-regression.py
          python3 tests/graphical-chezmoi-regression.py
          python3 tests/installer-state-regression.py
          python3 tests/resume-repair-regression.py
          python3 tests/elogind-dbus-regression.py
